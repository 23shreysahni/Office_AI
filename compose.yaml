name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

x-proxy: &proxy
  image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 1
  pids_limit: 128
  volumes:
    - ./state/nginx:/etc/nginx/generated:ro
  secrets: [tls_certificate, tls_private_key]
  tmpfs: ['/tmp:size=32m,mode=1777']
  networks: [frontend, ingress]
  depends_on:
    webui:
      condition: service_healthy
  healthcheck:
    test: [CMD, nginx, -t, -c, /etc/nginx/generated/lan.conf]
    interval: 30s
    timeout: 10s
    retries: 3
  logging:
    driver: local
    options: {max-size: 10m, max-file: '3'}

services:
  proxy:
    <<: *proxy
    profiles: [lan]
    ports:
      - '${LAN_BIND_IP:?Set LAN_BIND_IP}:443:443/tcp'
    entrypoint: [nginx]
    command: [-g, 'daemon off;', -c, /etc/nginx/generated/lan.conf]

  bootstrap:
    <<: *proxy
    profiles: [bootstrap]
    ports: ['127.0.0.1:8443:443/tcp']
    entrypoint: [nginx]
    command: [-g, 'daemon off;', -c, /etc/nginx/generated/bootstrap.conf]
    healthcheck:
      test: [CMD, nginx, -t, -c, /etc/nginx/generated/bootstrap.conf]
      interval: 30s
      timeout: 10s
      retries: 3

  webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${WEBUI_MEMORY:?Set WEBUI_MEMORY}
    cpus: ${WEBUI_CPUS:?Set WEBUI_CPUS}
    pids_limit: 512
    # Disable HTTP access logs; upstream Python is confined to this third-party image.
    command: [bash, start.sh, --workers, '1', --no-access-log, --ws-per-message-deflate, 'false']
    environment:
      WEBUI_URL: https://${OFFICE_HOSTNAME:?Set OFFICE_HOSTNAME}
      WEBUI_AUTH: 'true'
      WEBUI_SECRET_KEY_FILE: /run/secrets/webui_session_key
      ENABLE_SIGNUP: 'false'
      ENABLE_INITIAL_ADMIN_SIGNUP: 'false'
      ENABLE_PERSISTENT_CONFIG: 'false'
      DEFAULT_USER_ROLE: pending
      JWT_EXPIRES_IN: 1h
      WEBUI_SESSION_COOKIE_SECURE: 'true'
      WEBUI_AUTH_COOKIE_SECURE: 'true'
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
      WEBUI_AUTH_COOKIE_SAME_SITE: strict
      CORS_ALLOW_ORIGIN: https://${OFFICE_HOSTNAME:?Set OFFICE_HOSTNAME};https://${OFFICE_HOSTNAME:?Set OFFICE_HOSTNAME}:8443
      # No trusted identity headers. Trust no forwarded IP headers in the backend.
      FORWARDED_ALLOW_IPS: ''
      ENABLE_OLLAMA_API: 'true'
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_BASE_URLS: http://ollama:11434
      DEFAULT_MODELS: ${MODEL_NAME:?Set MODEL_NAME}
      DEFAULT_MODEL_PARAMS: '{"system":"Use British English. Give clear, evidence-based answers with enough explanation and examples to address the question fully. Keep answers brief when the user requests it. Generated content must be reviewed.","num_ctx":4096,"num_predict":1536,"temperature":0.2}'
      DEFAULT_LOCALE: en-GB
      WEBUI_BANNERS: '[{"id":"phase1","type":"warning","title":"Synthetic pilot only","content":"Generated content must be reviewed. Do not enter private documents or financial data.","dismissible":false}]'
      OFFLINE_MODE: 'true'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: 'true'
      SCARF_NO_ANALYTICS: 'true'
      ANONYMIZED_TELEMETRY: 'false'
      ENABLE_VERSION_UPDATE_CHECK: 'false'
      ENABLE_OPENAI_API: 'false'
      ENABLE_DIRECT_CONNECTIONS: 'false'
      ENABLE_DIRECT_INTEGRATIONS: 'false'
      ENABLE_OAUTH: 'false'
      ENABLE_OAUTH_SIGNUP: 'false'
      ENABLE_API_KEYS: 'false'
      ENABLE_WEB_SEARCH: 'false'
      ENABLE_IMAGE_GENERATION: 'false'
      ENABLE_CODE_EXECUTION: 'false'
      ENABLE_CODE_INTERPRETER: 'false'
      ENABLE_MEMORIES: 'false'
      ENABLE_CHANNELS: 'false'
      ENABLE_APPS: 'false'
      ENABLE_AUTOMATIONS: 'false'
      ENABLE_SUBAGENTS: 'false'
      ENABLE_TOOL_SEARCH: 'false'
      ENABLE_TOOL_SERVERS: 'false'
      ENABLE_COMMUNITY_SHARING: 'false'
      ENABLE_USER_WEBHOOKS: 'false'
      ENABLE_FOLLOW_UP_GENERATION: 'false'
      ENABLE_TAGS_GENERATION: 'false'
      ENABLE_TITLE_GENERATION: 'false'
      ENABLE_SEARCH_QUERY_GENERATION: 'false'
      ENABLE_RETRIEVAL_QUERY_GENERATION: 'false'
      ENABLE_ADMIN_EXPORT: 'false'
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: 'false'
      USER_PERMISSIONS_CHAT_SHARE: 'false'
      USER_PERMISSIONS_CHAT_IMPORT: 'false'
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: 'false'
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: 'false'
      GLOBAL_LOG_LEVEL: ERROR
      LOG_FORMAT: json
      AUDIT_LOG_LEVEL: NONE
      UVICORN_WORKERS: '1'
    secrets: [webui_session_key]
    volumes: [./state/webui:/app/backend/data]
    networks: [frontend, inference]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=4)']
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}

  ollama:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${OLLAMA_MEMORY:?Set OLLAMA_MEMORY}
    cpus: ${OLLAMA_CPUS:?Set OLLAMA_CPUS}
    pids_limit: 256
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: 5m
      CUDA_VISIBLE_DEVICES: '-1'
      GGML_VK_VISIBLE_DEVICES: '-1'
    volumes: [./state/ollama:/root/.ollama]
    networks: [inference]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}

networks:
  frontend:
    internal: true
  inference:
    internal: true
  # Docker cannot publish host ports from an internal-only bridge. Keep the
  # backend path internal; attach only the TLS proxy to a non-NAT ingress bridge.
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

secrets:
  tls_certificate:
    file: ./secrets/tls/server.crt
  tls_private_key:
    file: ./secrets/tls/server.key
  webui_session_key:
    file: ./secrets/webui_session_key
